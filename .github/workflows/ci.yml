name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Sync
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check lemma scripts tests
      - name: Mypy
        run: uv run mypy lemma
      - name: Pytest
        run: uv run pytest tests/ -q
      - name: Red-team
        run: uv run python scripts/red_team_eve.py
